limit_req_zone $binary_remote_addr zone=bluemates_per_ip:10m rate=15r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name bluemates.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name bluemates.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/bluemates.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bluemates.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        limit_req zone=bluemates_per_ip burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
